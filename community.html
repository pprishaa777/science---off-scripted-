<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Community — Science Off-Script</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header">

    <a class="logo" href="index.html">
      SCIENCE <span>—</span> OFF-SCRIPT
    </a>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="interviews.html">Interviews</a>
      <a href="discoveries.html">Discoveries</a>
      <a href="explained.html">Explained</a>

    </nav>

    <div class="header-actions">
      <a class="pill-btn" href="community.html">
        Join the Community
      </a>
    </div>

  </header>


  <main>

    <section class="simple-section section-pad">

      <p class="eyebrow" id="community-eyebrow"></p>

      <h1 id="community-title"></h1>

      <p class="section-intro" id="community-description"></p>

    </section>


    <section class="section-pad community-section">

  <div class="community-text">

    <p class="eyebrow">
      ASK A QUESTION
    </p>

    <h2 id="community-form-title"></h2>

    <p id="community-form-text"></p>

  </div>


  <div class="community-form-box">

    <form class="community-form">

      <label for="question">
        Your question
      </label>

      <textarea
        id="question"
        name="question"
        rows="6"
        placeholder="What would you ask a researcher?"
      ></textarea>

      <button type="submit" class="pill-btn">
        Send your question →
      </button>

    </form>

  </div>

</section>

  </main>


  <footer class="site-footer">

    <div>

      <p class="eyebrow">
        SCIENCE — OFF-SCRIPT
      </p>

      <h2>
        Have a question<br>
        for a researcher?
      </h2>

    </div>

    <a class="pill-btn" href="community.html">
      Join the Community
    </a>

  </footer>


  <script src="content.js"></script>
  <script src="script.js"></script>
